name: Compile Assets

on:
  push:
    branches: [main]
    paths:
      - 'resources/assets/**'
      - 'package.json'
      - 'webpack.mix.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run production
